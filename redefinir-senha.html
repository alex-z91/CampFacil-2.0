<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nova senha | MEUCAMP</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3f7f3;color:#163a2b;display:grid;min-height:100vh;place-items:center;margin:0;padding:20px;box-sizing:border-box}.card{width:100%;max-width:420px;padding:34px;background:white;border:1px solid #dfebe2;border-radius:16px;box-shadow:0 20px 60px #122b2010}a{color:#267449}h1{font-size:25px;font-weight:600;letter-spacing:-.5px}p{color:#698273;font-size:14px;line-height:1.6}label{font-size:13px;font-weight:600;display:block;margin:20px 0 7px}input{width:100%;padding:14px;box-sizing:border-box;border:1px solid #cfded2;border-radius:9px;font-size:15px}button{border:0;background:#287b4f;color:#fff;padding:14px;border-radius:9px;font-size:14px;font-weight:600;width:100%;margin:23px 0 12px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px}small{color:#718479}.brand{font-size:20px;font-weight:700;text-decoration:none}</style></head><body><main class="card"><a class="brand" href="index.html">MEUCAMP.</a><h1>Definir nova senha</h1><p>Escolha uma senha segura de pelo menos 12 caracteres.</p><form id="form"><label for="password">Nova senha</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Confirmar senha</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">Salvar nova senha</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="login.html">← Voltar para entrar</a></p></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),f=document.querySelector('#form'),s=document.querySelector('#status');if(!token||q.get('error')){f.hidden=true;s.textContent='Este link está inválido ou expirou. Solicite outra recuperação.'}history.replaceState(null,'',location.pathname);f.addEventListener('submit',async e=>{e.preventDefault();const pass=document.querySelector('#password').value;if(pass!==document.querySelector('#confirm').value){s.textContent='As senhas não coincidem.';return}const b=f.querySelector('button');b.disabled=true;s.textContent='Atualizando senha...';try{const r=await fetch('https://api.meucamp.alexcoder.space/api/auth/reset-password',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:pass})});if(!r.ok)throw Error('Não foi possível redefinir. O link pode ter expirado.');s.textContent='Senha atualizada. Agora você pode entrar.';f.hidden=true}catch(err){s.textContent=err.message}finally{b.disabled=false}});</script></body></html>
