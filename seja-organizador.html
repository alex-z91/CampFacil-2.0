<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seja um organizador | Arena Pro</title><link rel="stylesheet" href="login.css"><style>body{background:#f4f8f4}.application{max-width:740px;background:#fff;padding:32px;border:1px solid #e1e9e1;border-radius:16px;margin:6vh auto}.application h1{font-size:30px;font-weight:600}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:13px;font-weight:600}.fields input,.fields select{width:100%;display:block;padding:13px;margin-top:8px;border:1px solid #dae5dd;border-radius:8px;font:inherit}.full{grid-column:1/-1}.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;margin:22px 0}.consent input{margin-top:4px}.action{background:#ff9825;color:white;border:0;border-radius:8px;padding:14px 24px;font:inherit;cursor:pointer}.action:disabled{opacity:.5}#feedback{font-size:13px}@media(max-width:660px){.application{margin:0;padding:24px;border-radius:0}.fields{grid-template-columns:1fr}}</style><style>:root{--brand:#ff9825;--brand-orange:#ff9825;--primary:#ff9825}button[type=submit],.submit,.action{background:#ff9825!important;color:#171717!important}a.brand,.brand{font-weight:700;color:#1c1c1c!important}.mark{background:#ff9825!important;color:#fff!important}.dot{color:#ff9825!important}</style><link rel="stylesheet" href="arena-theme.css?v=1"><style>
#feedback:empty{display:none}
#feedback{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;margin:18px 0 6px;border-radius:10px;border:1px solid #ffd1cc;border-left:5px solid #ca3434;background:#fff1ef;color:#792525;font-size:14px;line-height:1.5;outline:none}
#feedback[data-state="success"]{border-color:#bce6cd;border-left-color:#22864e;background:#edf9f1;color:#1a5e37}
#feedback[data-state="loading"]{border-color:#f2dcba;border-left-color:#ff9825;background:#fff7eb;color:#684213}
#feedback .alert-icon{display:grid;place-items:center;flex:0 0 26px;height:26px;border-radius:50%;background:currentColor;font-weight:700;font-size:17px}
#feedback .alert-icon{color:#b52d2d;background:#ffe1df}
#feedback[data-state="success"] .alert-icon{color:#167643;background:#d0eedb}
#feedback[data-state="loading"] .alert-icon{color:#955a00;background:#ffe3b8}
#feedback .alert-body{display:flex;flex-direction:column;gap:3px;min-width:0}
#feedback .alert-body strong{font-size:15px;font-weight:700}
#feedback .alert-body a{color:inherit;text-decoration:underline;font-weight:700;margin-top:5px}
#application input:focus-visible{outline:2px solid #ff9825;outline-offset:2px}
</style></head><body><main class="application"><a href="index.html" class="brand">arena pro</a><h1>Organize seu próximo campeonato</h1><p>Crie sua conta e entre para preparar seu campeonato. A primeira publicação fica sujeita à aprovação da equipe Arena Pro.</p><form id="application"><div class="fields"><label class="full">Nome da organização<input name="organization_name" maxlength="180" minlength="3" required></label><label>Responsável<input name="contact_name" maxlength="180" minlength="3" required></label><label>E-mail<input name="email" type="email" maxlength="254" required></label><label>WhatsApp / telefone<input name="phone" type="tel" minlength="8" maxlength="32" required></label><label>Cidade<input name="city" maxlength="120" required></label><label>UF<input name="state" maxlength="2" minlength="2" placeholder="PA" required></label><label>CPF/CNPJ (opcional)<input name="document_number" maxlength="18"></label><label class="full">Crie uma senha (mínimo de 12 caracteres)<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label></div><label class="consent"><input type="checkbox" name="consent" required><span>Autorizo o uso dos dados informados para análise da solicitação e contato comercial, conforme a política de privacidade da plataforma.</span></label><button class="action" type="submit">Criar minha conta</button><p id="feedback" role="alert" tabindex="-1" aria-live="polite"></p></form><p><a href="login.html">Já tenho uma conta →</a></p></main><script src="organizador-solicitar.js?v=4"></script></body></html>
