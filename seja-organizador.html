<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seja um organizador | MEUCAMP</title><link rel="stylesheet" href="login.css"><style>body{background:#f4f8f4}.application{max-width:740px;background:#fff;padding:32px;border:1px solid #e1e9e1;border-radius:16px;margin:6vh auto}.application h1{font-size:30px;font-weight:600}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fields label{font-size:13px;font-weight:600}.fields input,.fields select{width:100%;display:block;padding:13px;margin-top:8px;border:1px solid #dae5dd;border-radius:8px;font:inherit}.full{grid-column:1/-1}.consent{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.6;margin:22px 0}.consent input{margin-top:4px}.action{background:#287a4f;color:white;border:0;border-radius:8px;padding:14px 24px;font:inherit;cursor:pointer}.action:disabled{opacity:.5}#feedback{font-size:13px}@media(max-width:660px){.application{margin:0;padding:24px;border-radius:0}.fields{grid-template-columns:1fr}}</style></head><body><main class="application"><a href="index.html" class="brand">MEUCAMP.</a><h1>Organize seu próximo campeonato</h1><p>Informe os dados da sua organização uma única vez. Depois acompanhe a aprovação pelo seu link pessoal e, quando aprovado, crie apenas a senha de acesso.</p><form id="application"><div class="fields"><label class="full">Nome da organização<input name="organization_name" maxlength="180" minlength="3" required></label><label>Responsável<input name="contact_name" maxlength="180" minlength="3" required></label><label>E-mail<input name="email" type="email" maxlength="254" required></label><label>WhatsApp / telefone<input name="phone" type="tel" minlength="8" maxlength="32" required></label><label>Cidade<input name="city" maxlength="120" required></label><label>UF<input name="state" maxlength="2" minlength="2" placeholder="PA" required></label><label>CPF/CNPJ (opcional)<input name="document_number" maxlength="18"></label></div><label class="consent"><input type="checkbox" name="consent" required><span>Autorizo o uso dos dados informados para análise da solicitação e contato comercial, conforme a política de privacidade da plataforma.</span></label><button class="action" type="submit">Solicitar acesso</button><p id="feedback" role="status" aria-live="polite"></p></form><p><a href="login.html">Já tenho uma conta →</a></p></main><script src="organizador-solicitar.js?v=2"></script></body></html>
