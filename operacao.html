<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operação esportiva | MEUCAMP</title><style>body{margin:0;background:#f5f8f6;color:#224333;font:14px system-ui}.wrap{max-width:1000px;margin:30px auto;padding:20px}.panel{background:#fff;border:1px solid #deebe2;border-radius:12px;padding:22px;margin:16px 0}h1,h2{font-weight:600}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d3e0d5;border-radius:7px}label{display:block;font-size:13px;margin:8px 0}button{border:0;background:#246f48;color:#fff;padding:12px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.notice{background:#e6f2e8;padding:13px;border-radius:8px}.muted{color:#698172}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eaf0ea}.danger{background:#b14d4d}#secured[hidden]{display:none}@media(max-width:640px){.grid{grid-template-columns:1fr}} .action-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0;align-items:start}.action-card{background:#fff;border:1px solid #deebe2;border-radius:12px;overflow:hidden}.action-card[open]{border-color:#80b99a;box-shadow:0 5px 20px #1d5b3820}.action-card summary{display:flex;align-items:center;gap:13px;padding:19px;cursor:pointer;list-style:none}.action-card summary::-webkit-details-marker{display:none}.action-card strong{display:block;font-size:15px}.action-card small{display:block;color:#698172;margin-top:4px}.action-icon{background:#e6f3ea;color:#26744e;display:grid;place-items:center;width:39px;height:39px;border-radius:9px;font-size:22px}.chevron{margin-left:auto;font-size:20px;transition:transform .2s}.action-card[open] .chevron{transform:rotate(180deg)}.action-body{border-top:1px solid #e6eee8;padding:18px}.action-body .grid{grid-template-columns:1fr 1fr}.context{margin-bottom:0}@media(max-width:760px){.action-grid{grid-template-columns:1fr}}@media(max-width:470px){.action-body .grid{grid-template-columns:1fr}} .action-grid{align-items:stretch}.action-card{display:flex;align-items:center;gap:14px;text-align:left;padding:22px;width:100%;min-height:94px;transition:border-color .16s,box-shadow .16s,transform .16s;color:inherit;cursor:pointer}.action-card:hover,.action-card:focus-visible{border-color:#70ae85;box-shadow:0 8px 24px #225e3c15;transform:translateY(-1px)}.card-copy{flex:1}.card-copy strong{display:block;font-size:15px}.card-copy small{display:block;margin-top:5px;color:#698172}.card-arrow{font-size:20px;color:#6c9c7d}.action-card .action-icon{flex-shrink:0}#operation-modal{border:1px solid #dceae0;border-radius:14px;padding:0;width:min(680px,calc(100vw - 24px));max-height:min(85vh,850px);box-shadow:0 20px 90px #102f2440;color:#224333}#operation-modal::backdrop{background:#0d291bbb;backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #e3ece5}.modal-head h2{margin:5px 0 0;font-size:21px}.modal-eyebrow{font-size:10px;letter-spacing:.13em;color:#708b7b}.modal-close{background:#eaf3ed;color:#28573c;width:35px;height:35px;font-size:23px;padding:0}#modal-content{padding:24px;overflow:auto;max-height:calc(85vh - 100px)}#modal-content .grid{grid-template-columns:repeat(2,minmax(0,1fr))}#modal-content form button{align-self:end}body:has(#operation-modal[open]){overflow:hidden}@media(max-width:540px){#modal-content .grid{grid-template-columns:1fr}#modal-content,.modal-head{padding:17px}#operation-modal{max-height:92vh}} </style></head><body><main class="wrap"><a href="admin.html">← Painel organizador</a><h1>Eventos e inscrições</h1><p id="message" class="notice" role="status">Verificando sessão…</p><section id="secured" hidden><div class="panel context"><div class="grid"><label>Organização<select id="org"></select></label><label>Evento selecionado<select id="event"></select></label></div></div><div class="action-grid"><button type="button" class="action-card" data-modal="0" aria-haspopup="dialog"><span class="action-icon">＋</span><span class="card-copy"><strong>Novo evento</strong><small>Crie um campeonato</small></span><span class="card-arrow" aria-hidden="true">↗</span></button><button type="button" class="action-card" data-modal="1" aria-haspopup="dialog"><span class="action-icon">♙</span><span class="card-copy"><strong>Cadastrar atleta</strong><small>Dados e equipe</small></span><span class="card-arrow" aria-hidden="true">↗</span></button><button type="button" class="action-card" data-modal="2" aria-haspopup="dialog"><span class="action-icon">▦</span><span class="card-copy"><strong>Criar categoria</strong><small>Faixa, peso e idade</small></span><span class="card-arrow" aria-hidden="true">↗</span></button><button type="button" class="action-card" data-modal="3" aria-haspopup="dialog"><span class="action-icon">✓</span><span class="card-copy"><strong>Nova inscrição</strong><small>Inscrição pendente</small></span><span class="card-arrow" aria-hidden="true">↗</span></button></div><div class="panel"><h2>Inscrições do evento</h2><div style="overflow:auto"><table><thead><tr><th>Atleta</th><th>Categoria</th><th>Pagamento</th><th>Ação</th></tr></thead><tbody id="entries"></tbody></table></div></div></section><dialog id="operation-modal" aria-labelledby="modal-title"><div class="modal-head"><div><span class="modal-eyebrow">MEUCAMP · OPERAÇÃO</span><h2 id="modal-title">Nova operação</h2></div><button type="button" id="modal-close" class="modal-close" aria-label="Fechar formulário">×</button></div><div id="modal-content"></div></dialog></main><template id="form-templates"><section data-form="0"><form id="event-form" class="grid"><label>Nome<input name="name" required minlength="3"></label><label>Data<input name="event_date" type="date" required></label><label>Cidade<input name="city" required></label><button>Criar evento</button></form></section><section data-form="1"><form id="athlete-form" class="grid"><label>Nome<input name="full_name" required></label><label>Nascimento<input name="birth_date" type="date" required></label><label>Equipe<input name="team"></label><label>Faixa<input name="belt" placeholder="Branca" required></label><label>Peso em kg<input name="weight_kg" type="number" min="10" max="300" step=".01" required></label><button>Cadastrar atleta</button></form><p class="muted" id="athlete-current">Nenhum atleta selecionado.</p></section><section data-form="2"><form id="category-form" class="grid"><label>Categoria<input name="name" required></label><label>Faixa<input name="belt" required></label><label>Peso mínimo kg<input name="min_weight_kg" type="number" min="0" max="300" value="0" required></label><label>Peso máximo kg<input name="max_weight_kg" type="number" min="0" max="300" value="300" required></label><label>Ano inicial<input name="min_birth_year" type="number" min="1900" max="2100" value="1900" required></label><label>Ano final<input name="max_birth_year" type="number" min="1900" max="2100" value="2100" required></label><button>Criar categoria</button></form><p id="category-current" class="muted">Nenhuma categoria selecionada.</p></section><section data-form="3"><p class="muted">Use o atleta e a categoria recém-criados. A inscrição começa pendente.</p><form id="entry-form"><label>Valor R$<input name="price" type="number" min="0" step=".01" value="100" required></label><button>Criar inscrição pendente</button></form></section></template><script>(()=>{const dialog=document.querySelector('#operation-modal');const content=document.querySelector('#modal-content');const fragments=[...document.querySelector('#form-templates').content.querySelectorAll('[data-form]')];document.querySelectorAll('[data-modal]').forEach(card=>card.addEventListener('click',()=>{const idx=Number(card.dataset.modal);content.replaceChildren(fragments[idx]);document.querySelector('#modal-title').textContent=card.querySelector('strong').textContent;dialog.showModal();content.querySelector('input,select')?.focus()}));document.querySelector('#modal-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});})();</script><script src="operacao.js?v=3"></script></body></html>
