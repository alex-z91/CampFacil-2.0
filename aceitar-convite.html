<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Aceitar convite | MEUCAMP</title><style>body{font:15px Inter,system-ui,sans-serif;background:#f3f7f4;color:#183a2b}.box{max-width:510px;margin:8vh auto;background:#fff;border:1px solid #dfebe2;border-radius:14px;padding:32px}h1{font-weight:600}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0ded4;border-radius:8px;margin:7px 0 15px}button{padding:13px 19px;background:#21794e;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}#feedback{padding:12px;background:#ebf3ed;border-radius:8px;margin:14px 0}a{color:#21794e}small{color:#64816d}</style></head><body><main class="box"><a href="index.html">MEUCAMP.</a><h1>Convite de organizador</h1><p id="description">Validando seu convite…</p><p id="feedback" role="status" aria-live="polite">Aguarde.</p><section id="actions" hidden><button type="button" id="accept">Aceitar convite com minha sessão atual</button><p><small>Já possui cadastro, mas não está conectado? <a href="login.html">Entre na plataforma</a> e depois volte a este link.</small></p><hr><h2>Primeiro acesso</h2><form id="signup"><label>Nome completo<input name="name" minlength="2" required autocomplete="name"></label><label>Crie uma senha (12 caracteres ou mais)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button type="submit">Criar conta e aceitar convite</button></form></section></main><script src="aceitar-convite.js"></script></body></html>
