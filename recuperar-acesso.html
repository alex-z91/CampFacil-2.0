<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar acesso | MEUCAMP</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3f7f3;color:#163a2b;display:grid;min-height:100vh;place-items:center;margin:0;padding:20px;box-sizing:border-box}.card{width:100%;max-width:420px;padding:34px;background:white;border:1px solid #dfebe2;border-radius:16px;box-shadow:0 20px 60px #122b2010}a{color:#267449}h1{font-size:25px;font-weight:600;letter-spacing:-.5px}p{color:#698273;font-size:14px;line-height:1.6}label{font-size:13px;font-weight:600;display:block;margin:20px 0 7px}input{width:100%;padding:14px;box-sizing:border-box;border:1px solid #cfded2;border-radius:9px;font-size:15px}button{border:0;background:#287b4f;color:#fff;padding:14px;border-radius:9px;font-size:14px;font-weight:600;width:100%;margin:23px 0 12px;cursor:pointer}button:disabled{opacity:.5}#status{min-height:24px}small{color:#718479}.brand{font-size:20px;font-weight:700;text-decoration:none}</style></head><body><main class="card"><a class="brand" href="index.html">MEUCAMP.</a><h1>Recuperar acesso</h1><p>Informe o e-mail cadastrado para receber instruções de redefinição de senha.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required placeholder="seu@email.com"><button type="submit">Enviar instruções</button></form><p id="status" role="status" aria-live="polite"></p><small>Se não receber, confira o spam. A recuperação depende do serviço de e-mail configurado no Neon Auth.</small><p><a href="login.html">← Voltar para entrar</a></p></main><script>const f=document.querySelector('#form'),s=document.querySelector('#status');f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;s.textContent='Solicitando recuperação...';try{const r=await fetch('https://api.meucamp.alexcoder.space/api/auth/request-password-reset',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim()})});if(!r.ok)throw Error('Não foi possível solicitar agora. Tente novamente mais tarde.');s.textContent='Se o e-mail estiver cadastrado e habilitado, você receberá instruções.'}catch(err){s.textContent=err.message}finally{b.disabled=false}});</script></body></html>
